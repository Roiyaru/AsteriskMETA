name: Build Test APK (Merge)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: merge-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build patched AsteriskMETA APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Native submodules are required by the release build. This repository's tree
          # is the patched base, so no upstream clone is needed.
          submodules: recursive

      - name: Wait for libclash.aar release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*const val ANDROID_LIB_CLASH_LITE_VERSION = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Unable to read ANDROID_LIB_CLASH_LITE_VERSION from ProjectConfig."
            exit 1
          fi
          url="https://github.com/Asterisk4Magisk/AndroidLibClashLite/releases/download/${version}/libclash.aar"
          echo "expecting $url"
          for i in $(seq 1 40); do
            if curl -fsIL --max-time 30 "$url" >/dev/null 2>&1; then
              echo "libclash.aar is available"
              exit 0
            fi
            echo "waiting for libclash.aar ($i/40)"
            sleep 45
          done
          echo "::error::libclash.aar did not become available in time"
          exit 1

      - name: Apply source patches
        run: |
          set -euo pipefail
          # Only the test-identity patch remains: upstream now carries its own
          # process-ownership fixes (flow metadata + libclash), so the old HevFix
          # patches are gone.
          patch -p1 < patches/ameta-source.patch
          chmod +x gradlew

      - name: Resolve version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # The previous test builds shipped versionCode 500 and this fork keeps a
          # squashed history, so derive a monotonic value from the run number.
          version_code="$((500 + GITHUB_RUN_NUMBER))"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Using versionCode=$version_code"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          licenses_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$licenses_status" -ne 0 ]; then
            echo "::error::Failed to accept Android SDK licenses."
            exit "$licenses_status"
          fi

          target_sdk="$(sed -n 's/^[[:space:]]*const val TARGET_SDK = \([0-9]\+\).*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          target_sdk_minor="$(sed -n 's/^[[:space:]]*const val TARGET_SDK_MINOR = \([0-9]\+\).*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$target_sdk" ] || [ -z "$target_sdk_minor" ]; then
            echo "::error::Unable to read TARGET_SDK from ProjectConfig."
            exit 1
          fi

          available_packages="$(sdkmanager --list | awk '{ print $1 }')"
          platform_package="platforms;android-${target_sdk}"
          if ! grep -Fxq "$platform_package" <<< "$available_packages"; then
            if grep -Fxq "platforms;android-${target_sdk}.0" <<< "$available_packages"; then
              platform_package="platforms;android-${target_sdk}.0"
            else
              echo "::error::No Android SDK platform package is available for TARGET_SDK=$target_sdk."
              exit 1
            fi
          fi

          build_tools_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^build-tools;[0-9]/ { print $1 }' | sort -V | tail -n 1)"
          ndk_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^ndk;[0-9]/ { print $1 }' | sort -V | tail -n 1)"
          cmake_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^cmake;[0-9]/ { print $1 }' | sort -V | tail -n 1)"

          for pkg in "$build_tools_package" "$ndk_package" "$cmake_package"; do
            if [ -z "$pkg" ]; then
              echo "::error::Missing required SDK package."
              exit 1
            fi
          done

          sdkmanager --install "$platform_package" "platforms;android-${target_sdk}.${target_sdk_minor}" "$build_tools_package" "$ndk_package" "$cmake_package"

          ndk_version="${ndk_package#ndk;}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: ./gradlew --no-daemon :app:assembleRelease -Pcore=mihomo -PversionCode="$VERSION_CODE" -PbuildAbis=arm64-v8a -PbuildUniversalApk=false 2>&1 | tee build.log

      - name: Upload build logs on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI build logs
          files: build.log

      - name: Sign release APKs
        shell: bash
        run: |
          set -euo pipefail

          openssl pkcs12 -export \
            -out "$RUNNER_TEMP/test.p12" \
            -inkey signing/key.pem \
            -in signing/cert.pem \
            -name testkey \
            -passout pass:androidtest

          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$zipalign" ] || [ -z "$apksigner" ]; then
            echo "::error::zipalign/apksigner not found."
            exit 1
          fi

          mkdir -p signed-apks
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            base_name="$(basename "$apk" .apk)"
            case "$base_name" in
              *arm64-v8a*) ;;
              *)
                echo "::error::Unexpected architecture in $base_name"
                exit 1
                ;;
            esac
            aligned_apk="$RUNNER_TEMP/${base_name}-aligned.apk"
            signed_apk="signed-apks/${base_name}-signed.apk"
            "$zipalign" -f -p 4 "$apk" "$aligned_apk"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/test.p12" \
              --ks-pass pass:androidtest \
              --ks-key-alias testkey \
              --key-pass pass:androidtest \
              --out "$signed_apk" \
              "$aligned_apk"
            "$apksigner" verify "$signed_apk"
          done
          ls -la signed-apks
          shopt -s nullglob
          apks=(signed-apks/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No signed APKs produced"
            exit 1
          fi
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected exactly one arm64-v8a APK, found ${#apks[@]}"
            exit 1
          fi

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -uo pipefail

          # The notes describe what this build changed, so they are derived from the
          # commits between the previous successful build and this one.
          previous_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-test.yml/runs?status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_sha != \"${GITHUB_SHA}\")][0].head_sha" 2>/dev/null || true)"

          # The checkout is shallow, so the history behind the baseline is not available
          # until it is fetched.
          if [ -n "$previous_sha" ] && [ "$previous_sha" != "null" ]; then
            git fetch --no-tags --depth=200 origin "$previous_sha" 2>/dev/null || true
          fi

          if [ -z "$previous_sha" ] || [ "$previous_sha" = "null" ] || ! git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
            previous_sha=""
          fi

          {
            echo "AsteriskMETA 测试包（构建于 \`${GITHUB_SHA:0:8}\`）。"
            echo ""
            echo "- Release 包名 \`org.asterisk.zcc.ameta.dev\`（与官方包并存，可覆盖历史测试包），测试签名与历史 test-* 一致"
            echo "- 仅提供 arm64-v8a 架构的 release 包"
            echo "- versionCode \`${VERSION_CODE}\`"
            echo ""
            echo "### 本次变更"
            echo ""
            if [ -n "$previous_sha" ] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
              # A commit that only touches the workflow or the notes changes nothing in
              # the app, so it does not belong in the summary.
              git log --no-merges --pretty=format:'%s' "${previous_sha}..${GITHUB_SHA}" -- app asteriskd buildSrc \
                | sed 's/^/- /' || true
              echo ""
              other="$(git log --no-merges --pretty=format:'%s' "${previous_sha}..${GITHUB_SHA}" -- .github PROGRESS.md 2>/dev/null | head -n 5 || true)"
              if [ -n "$other" ]; then
                echo ""
                echo "其它（非应用代码）："
                echo "$other" | sed 's/^/- /'
                echo ""
              fi
            else
              echo "- 首次构建"
              echo ""
            fi
            echo ""
            echo "### 变更涉及的文件"
            echo ""
            if [ -n "$previous_sha" ] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
              # The workflow and the notes themselves are not part of what the app
              # changed, so they stay out of the summary.
              git diff --stat "${previous_sha}..${GITHUB_SHA}" -- app asteriskd buildSrc \
                ':(exclude).github' ':(exclude)PROGRESS.md' | tail -n 30
            else
              git show --stat --oneline HEAD -- app asteriskd buildSrc | tail -n 30
            fi
          } > release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Merge Test ${{ github.run_number }}
          files: signed-apks/*.apk
          fail_on_unmatched_files: true
          prerelease: true
          body_path: release-notes.md

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: test-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$count" -lt 1 ]; then
            echo "::error::Release $TAG has no assets."
            exit 1
          fi
          echo "published $count assets"
